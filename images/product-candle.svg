<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#E8E0D4" rx="8"/>
  <!-- Candle vessel -->
  <rect x="60" y="90" width="80" height="65" rx="6" fill="#2C2C2C"/>
  <!-- Wax surface -->
  <ellipse cx="100" cy="92" rx="40" ry="8" fill="#3A3A3A"/>
  <!-- Wick -->
  <line x1="100" y1="72" x2="100" y2="86" stroke="#7A7A7A" stroke-width="1.5"/>
  <!-- Flame -->
  <path d="M100,58 Q106,66 100,74 Q94,66 100,58Z" fill="#8B6F4E"/>
  <path d="M100,62 Q104,67 100,72 Q96,67 100,62Z" fill="#C9B99A"/>
  <!-- Label -->
  <text x="100" y="118" text-anchor="middle" font-family="sans-serif" font-size="7" font-weight="600" fill="#8B6F4E" letter-spacing="1.5">THE SHOP</text>
  <text x="100" y="130" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="400" fill="#8B6F4E" letter-spacing="1">CANDLE</text>
  <!-- Decorative line -->
  <line x1="80" y1="137" x2="120" y2="137" stroke="#8B6F4E" stroke-width="0.5" opacity="0.5"/>
</svg>
