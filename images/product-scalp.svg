<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#E8E0D4" rx="8"/>
  <!-- Dropper bottle -->
  <rect x="78" y="75" width="44" height="80" rx="4" fill="#2C2C2C"/>
  <!-- Neck -->
  <rect x="90" y="58" width="20" height="22" rx="2" fill="#3A3A3A"/>
  <!-- Dropper bulb -->
  <ellipse cx="100" cy="50" rx="10" ry="10" fill="#8B6F4E"/>
  <!-- Glass pipette -->
  <rect x="98" y="58" width="4" height="15" rx="1" fill="#8B6F4E" opacity="0.5"/>
  <!-- Label -->
  <rect x="83" y="90" width="34" height="45" rx="2" fill="none" stroke="#8B6F4E" stroke-width="1.2"/>
  <text x="100" y="108" text-anchor="middle" font-family="sans-serif" font-size="5.5" font-weight="600" fill="#8B6F4E" letter-spacing="0.8">SCALP</text>
  <text x="100" y="118" text-anchor="middle" font-family="sans-serif" font-size="5.5" font-weight="600" fill="#8B6F4E" letter-spacing="0.8">REVIVAL</text>
</svg>
