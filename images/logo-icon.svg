<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- Compact icon mark — scissor KK -->
  <circle cx="60" cy="60" r="56" stroke="#2C2C2C" stroke-width="2.5" fill="none"/>
  <circle cx="60" cy="60" r="48" stroke="#8B6F4E" stroke-width="0.75" fill="none"/>

  <!-- Scissor-K pair -->
  <g transform="translate(60, 56)">

    <!-- First K -->
    <g transform="translate(-22, 0)">
      <rect x="0" y="-16" width="2.5" height="32" fill="#2C2C2C"/>
      <polygon points="2.5,-3 17,-15 21,-15 6.5,-1" fill="#2C2C2C"/>
      <circle cx="21" cy="-15" r="3.2" stroke="#2C2C2C" stroke-width="1.2" fill="none"/>
      <polygon points="2.5,3 17,15 21,15 6.5,1" fill="#2C2C2C"/>
      <circle cx="21" cy="15" r="3.2" stroke="#2C2C2C" stroke-width="1.2" fill="none"/>
      <circle cx="2.5" cy="0" r="1.3" fill="#8B6F4E"/>
    </g>

    <!-- Second K -->
    <g transform="translate(4, 0)">
      <rect x="0" y="-16" width="2.5" height="32" fill="#2C2C2C"/>
      <polygon points="2.5,-3 17,-15 21,-15 6.5,-1" fill="#2C2C2C"/>
      <circle cx="21" cy="-15" r="3.2" stroke="#2C2C2C" stroke-width="1.2" fill="none"/>
      <polygon points="2.5,3 17,15 21,15 6.5,1" fill="#2C2C2C"/>
      <circle cx="21" cy="15" r="3.2" stroke="#2C2C2C" stroke-width="1.2" fill="none"/>
      <circle cx="2.5" cy="0" r="1.3" fill="#8B6F4E"/>
    </g>

  </g>
</svg>
