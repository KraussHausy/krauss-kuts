  <text x="100" y="108" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="600" fill="#8B6F4E" letter-spacing="1">CEDAR</text>
  <text x="100" y="118" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="600" fill="#8B6F4E" letter-spacing="1">BEARD OIL</text>
