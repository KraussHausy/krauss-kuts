<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#E8E0D4" rx="8"/>

  <!-- Barber chair silhouette -->
  <g transform="translate(400, 260)">
    <!-- Chair base -->
    <rect x="-60" y="80" width="120" height="15" rx="4" fill="#3A3A3A"/>
    <rect x="-15" y="60" width="30" height="25" rx="2" fill="#3A3A3A"/>
    <!-- Chair seat -->
    <rect x="-70" y="10" width="140" height="55" rx="10" fill="#2C2C2C"/>
    <!-- Chair back -->
    <rect x="-55" y="-70" width="110" height="85" rx="8" fill="#2C2C2C"/>
    <!-- Armrests -->
    <rect x="-80" y="10" width="20" height="40" rx="6" fill="#2C2C2C"/>
    <rect x="60" y="10" width="20" height="40" rx="6" fill="#2C2C2C"/>
    <!-- Headrest -->
    <rect x="-30" y="-90" width="60" height="25" rx="10" fill="#3A3A3A"/>
  </g>

  <!-- Client silhouette (seated) -->
  <g transform="translate(400, 130)" fill="#5A5A5A">
    <!-- Head -->
    <circle cx="0" cy="0" r="30"/>
    <!-- Shoulders/torso -->
    <ellipse cx="0" cy="60" rx="50" ry="35"/>
  </g>

  <!-- Barber silhouette (standing) -->
  <g transform="translate(280, 100)" fill="#4A4A4A">
    <!-- Head -->
    <circle cx="0" cy="0" r="22"/>
    <!-- Body -->
    <rect x="-25" y="20" width="50" height="100" rx="12"/>
    <!-- Arm extended (cutting) -->
    <g transform="rotate(-30, 25, 40)">
      <rect x="25" y="30" width="60" height="14" rx="7" fill="#4A4A4A"/>
    </g>
    <!-- Scissors in hand -->
    <g transform="translate(90, 20)" stroke="#8B6F4E" stroke-width="2" fill="none">
      <line x1="-8" y1="8" x2="5" y2="-8"/>
      <circle cx="-10" cy="11" r="4"/>
      <line x1="8" y1="8" x2="-5" y2="-8"/>
      <circle cx="10" cy="11" r="4"/>
    </g>
  </g>

  <!-- Mirror reflection (background) -->
  <rect x="500" y="40" width="180" height="260" rx="90" fill="none" stroke="#C9B99A" stroke-width="2" opacity="0.4"/>

  <!-- Shelf with products -->
  <line x1="520" y1="340" x2="680" y2="340" stroke="#8B6F4E" stroke-width="2"/>
  <rect x="540" y="310" width="20" height="30" rx="3" fill="#3A3A3A" opacity="0.6"/>
  <rect x="575" y="315" width="16" height="25" rx="3" fill="#3A3A3A" opacity="0.6"/>
  <rect x="605" y="308" width="22" height="32" rx="3" fill="#3A3A3A" opacity="0.6"/>
  <rect x="640" y="318" width="18" height="22" rx="3" fill="#3A3A3A" opacity="0.6"/>

  <!-- Decorative text -->
  <text x="400" y="460" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#8B6F4E" letter-spacing="8" opacity="0.6">THE KRAUSS KUTS EXPERIENCE</text>
</svg>
